services:
  frontend:
    image: js_app_frontend
    build:
      context: ./frontend
      args:
        - REACT_APP_API_URL=https://projectsigmatrading.ru/api
    networks:
      - app-network
    depends_on:
      - backend
    environment:
      - LOG_PATH=/app/logs
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 128M
    labels:
      - "logging=promtail"
    restart: unless-stopped

  backend:
    image: golang_app_backend
    build:
      context: ./backend
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      DB_HOST: dataBase
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      MODE_WORK: localhost
      ADMIN_KEY: ${ADMIN_KEY}
    networks:
      - app-network
    depends_on:
      dbmate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 128M
    labels:
      - "logging=promtail"
    restart: unless-stopped

  parser:
    image: rust_parser
    build:
      context: ./parser
    networks:
      - app-network
    depends_on:
      dbmate:
        condition: service_completed_successfully
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      DB_HOST: dataBase
      DB_PORT: 5432
      GLOBAL_WORK_MODE: 'imitation'
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 128M
    labels:
      - "logging=promtail"
    restart: unless-stopped

  celery_beat:
    image: python_app_ml_pipeline_celery_beat
    build:
      context: ./beat
    command: sh -c "cd src && celery -A celery_beat beat --loglevel=info"
    networks:
      - app-network
    depends_on:
      dbmate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      DB_HOST: dataBase
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      GLOBAL_WORK_MODE: 'imitation'
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    labels:
      - "logging=promtail"
    restart: unless-stopped

  celery_worker_pipeline:
    image: python_celery_worker_pipeline
    build:
      context: ./pipeline
    command: >
      sh -c "cd src && celery -A celery_worker worker 
      -Q pipeline_work
      --loglevel=info 
      --concurrency=1 
      --max-tasks-per-child=40 
      --prefetch-multiplier=1"
    networks:
      - app-network
    depends_on:
      dbmate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      DB_HOST: dataBase
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      GLOBAL_WORK_MODE: 'imitation'
    volumes:
      - ./pipeline/src/config:/app/src/config
      - ./pipeline/src/output:/app/src/output
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
    labels:
      - "logging=promtail"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    restart: unless-stopped

  dbmate:
    image: amacneil/dbmate
    command: --wait up
    environment:
      DATABASE_URL: "postgres://${DB_USER}:${DB_PASSWORD}@dataBase:5432/${DB_NAME}?sslmode=disable"
    networks:
      - app-network
    volumes:
      - ./migrations_vds:/db/migrations
    depends_on:
      dataBase:
        condition: service_healthy

  dataBase:
    image: postgres:16.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - app-network
    volumes:
      - db-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    labels:
      - "logging=promtail"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    restart: unless-stopped
    command:
      - '--nginx.scrape-uri=http://nginx/nginx_status'

  loki:
    image: grafana/loki:2.8.0
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki_data:/loki
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.8.0
    container_name: promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED}
      - GF_SERVER_ROOT_URL=http://62.113.37.47:3001
      - GF_SERVER_ENFORCE_DOMAIN=false
      - GF_SERVER_PROTOCOL=http
      - GF_SERVER_DOMAIN=62.113.37.47
    depends_on:
      - loki
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - node-exporter
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

volumes:
  db-data:
    name: projectsigmatrading_db-data
    driver: local
  loki_data:
  grafana_data:
  prometheus_data:

networks:
  app-network:
    driver: bridge
